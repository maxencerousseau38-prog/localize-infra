# Temporary. Answers one question that cannot be answered from a Windows
# machine: does a lockfile generated on Linux keep the win32 binaries, or does
# npm prune to whichever platform wrote it?
#
# If it prunes, regenerating on Linux is not a fix — it moves the breakage from
# CI onto the developer's machine. Deleted once the answer is recorded.
name: lockfile probe
on:
  push:
    branches: [chore/linux-lockfile]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inventory the committed lockfile
        run: |
          echo "npm $(npm -v) on $(uname -s)"
          node -e "
            const l=require('./package-lock.json');
            const p=Object.keys(l.packages);
            const m=(s)=>p.filter(k=>k.includes(s)).map(k=>k.split('node_modules/').pop());
            console.log('BEFORE rollup :', JSON.stringify(m('@rollup/rollup-')));
            console.log('BEFORE esbuild:', JSON.stringify(m('@esbuild/')));
            console.log('BEFORE biome  :', JSON.stringify(m('@biomejs/cli-')).slice(0,180));
          "
      - name: Regenerate on Linux
        run: rm -f package-lock.json && npm install --package-lock-only
      - name: Inventory the regenerated lockfile
        run: |
          node -e "
            const l=require('./package-lock.json');
            const p=Object.keys(l.packages);
            const m=(s)=>p.filter(k=>k.includes(s)).map(k=>k.split('node_modules/').pop());
            const r=m('@rollup/rollup-'), e=m('@esbuild/');
            console.log('AFTER rollup :', JSON.stringify(r));
            console.log('AFTER esbuild:', JSON.stringify(e));
            console.log('AFTER biome  :', JSON.stringify(m('@biomejs/cli-')).slice(0,180));
            console.log('VERDICT keeps-win32:', r.some(x=>x.includes('win32')) && e.some(x=>x.includes('win32')));
            console.log('VERDICT has-linux  :', r.some(x=>x.includes('linux')) && e.some(x=>x.includes('linux')));
          "
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package-lock
          path: package-lock.json
